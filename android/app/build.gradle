plugins { id 'com.android.application' }
android {
    namespace 'id.privatebridge.phone'
    compileSdk 35
    defaultConfig {
        applicationId 'id.privatebridge.phone'
        minSdk 30
        targetSdk 35
        versionCode 3
        versionName '2.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

