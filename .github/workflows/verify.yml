name: Local build and protocol checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Build pinned toolchains and debug APK
        env:
          BRIDGE_TOOLCHAIN_ROOT: ${{ runner.temp }}/bridge-tools
        run: bash scripts/cloud-setup.sh
      - name: Native, Android and backend checks
        env:
          BRIDGE_TOOLCHAIN_ROOT: ${{ runner.temp }}/bridge-tools
        run: bash scripts/verify-local.sh
      - name: Distribution integrity
        env:
          BRIDGE_DELIVERABLE_DIR: ${{ runner.temp }}/bridge-artifacts
        run: python scripts/package-deliverable.py
