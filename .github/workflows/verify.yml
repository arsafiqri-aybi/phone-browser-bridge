name: Verify phone Chrome bridge
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  relay-and-chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            agent/package-lock.json
            cloudflare/package-lock.json
      - run: npm ci --prefix agent --ignore-scripts
      - run: npm ci --prefix cloudflare --ignore-scripts
      - run: cd cloudflare && npx playwright install --with-deps chromium
      - name: Locate actual Chrome
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'CHROME_TEST_EXECUTABLE='+require('./cloudflare/node_modules/playwright').chromium.executablePath()+'\n')"
      - run: npm test --prefix agent
      - run: python3 scripts/test-termux-service.py
      - run: npm test --prefix cloudflare
      - run: npm audit --prefix agent --omit=dev --audit-level=high
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: chmod +x android/gradlew && cd android && ./gradlew --no-daemon assembleDebug
      - run: mkdir -p /tmp/phone-tests && javac -d /tmp/phone-tests android/app/src/main/java/id/privatebridge/phone/LocalHttp.java android/tests/LocalHttpTest.java && java -cp /tmp/phone-tests LocalHttpTest
      - uses: actions/upload-artifact@v4
        with:
          name: CI-test-APK-different-signing-key
          path: android/app/build/outputs/apk/debug/*.apk

