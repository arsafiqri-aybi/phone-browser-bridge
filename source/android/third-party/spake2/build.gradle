plugins { id 'com.android.library' }
android {
 namespace 'io.github.muntashirakon.crypto.spake2'
 compileSdk 35
 ndkVersion '27.0.12077973'
 defaultConfig { minSdk 31; ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' } }
 externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
dependencies { implementation 'androidx.annotation:annotation:1.9.1'; testImplementation 'junit:junit:4.13.2' }
