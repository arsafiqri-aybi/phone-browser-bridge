plugins { id 'com.android.application' }
android {
    namespace 'id.phonebridge'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'id.phonebridge'
        minSdk 31
        targetSdk 32
        versionCode 100
        versionName '0.1.0'
    }
    signingConfigs {
        debug { storeFile file(System.getenv('BRIDGE_DEBUG_STORE') ?: new File(System.getProperty('user.home'), '.android/debug.keystore').path) }
        owner {
            if (System.getenv('BRIDGE_SIGNING_STORE')) {
                storeFile file(System.getenv('BRIDGE_SIGNING_STORE'))
                storePassword System.getenv('BRIDGE_SIGNING_PASSWORD')
                keyAlias System.getenv('BRIDGE_SIGNING_ALIAS')
                keyPassword System.getenv('BRIDGE_SIGNING_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.owner; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation project(':libadb')
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
